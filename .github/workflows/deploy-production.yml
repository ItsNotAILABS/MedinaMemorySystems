name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'src/cloudflare-edge/**'
      - 'wrangler.toml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  deployments: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD & TEST
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            .next
            dist
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY STAGING
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://medina-edge-worker-staging.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers (Staging)
        run: |
          wrangler deploy --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Health Check
        run: |
          sleep 10
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://medina-edge-worker-staging.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev/health")
          if [ "$RESPONSE" != "200" ]; then
            echo "Health check failed with status code: $RESPONSE"
            exit 1
          fi
          echo "Health check passed!"

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY PRODUCTION
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://medina-edge-worker.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers (Production)
        run: |
          wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Health Check
        run: |
          sleep 10
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://medina-edge-worker.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev/health")
          if [ "$RESPONSE" != "200" ]; then
            echo "Health check failed with status code: $RESPONSE"
            exit 1
          fi
          echo "Health check passed!"

      - name: Create Deployment Summary
        run: |
          echo "## 𓂀 MEDINA Edge Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | medina-edge-worker |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| φ-Resonance | 1.618033988749895 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Charters" >> $GITHUB_STEP_SUMMARY
          echo "- MASTER-001 (Master Orchestrator)" >> $GITHUB_STEP_SUMMARY
          echo "- CF-ORCH-001 (Edge Orchestrator)" >> $GITHUB_STEP_SUMMARY
          echo "- CF-WKR-001 (Workers Bridge)" >> $GITHUB_STEP_SUMMARY
          echo "- CF-ETH-001 (Ethereum Gateway)" >> $GITHUB_STEP_SUMMARY
          echo "- CF-AI-001 (AI Gateway)" >> $GITHUB_STEP_SUMMARY
          echo "- CF-DUR-001 (Durable Objects)" >> $GITHUB_STEP_SUMMARY
          echo "- CF-STR-001 (Storage Bridge)" >> $GITHUB_STEP_SUMMARY
          echo "- CF-ENT-001 (Entanglement Engine)" >> $GITHUB_STEP_SUMMARY
          echo "- CF-CHAIN-001 (Blockchain Bridge)" >> $GITHUB_STEP_SUMMARY
          echo "- MEM-001 (Memory System)" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # ROLLBACK
  # ═══════════════════════════════════════════════════════════════════════════
  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    if: failure() && github.event.inputs.environment == 'production'
    needs: deploy-production
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Rollback to previous version
        run: |
          echo "Rolling back to previous deployment..."
          wrangler rollback --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify Rollback
        run: |
          echo "## ⚠️ Production Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A rollback was triggered due to deployment failure." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
