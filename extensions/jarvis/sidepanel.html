<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVISIUS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ───────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #0d0d14, #12121e);
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header .logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, #00d4ff 0%, #0066aa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }

    .header .title {
      font-size: 15px;
      font-weight: 600;
      color: #00d4ff;
      letter-spacing: 1px;
    }

    .header .status {
      margin-left: auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
    }

    .header .status.offline { background: #ff4444; box-shadow: 0 0 8px rgba(255, 68, 68, 0.5); }

    /* ─── Tabs ─────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      background: #0d0d14;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .tab-bar button {
      flex: 1;
      padding: 8px 4px;
      background: none;
      border: none;
      color: #666;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
    }

    .tab-bar button.active {
      color: #00d4ff;
      border-bottom-color: #00d4ff;
    }

    .tab-bar button:hover { color: #aaa; }

    /* ─── Content Panels ───────────────────────────────────── */
    .panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
    .panel.active { display: flex; }

    /* ─── Chat Panel ───────────────────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.2); border-radius: 2px; }

    .msg {
      max-width: 90%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: #e0e0e0;
    }

    .msg.jarvis {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ccc;
    }

    .msg.system {
      align-self: center;
      font-size: 11px;
      color: #666;
      font-style: italic;
    }

    .chat-input-area {
      padding: 8px 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 8px 14px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }

    .chat-input-area input:focus { border-color: rgba(0,212,255,0.4); }
    .chat-input-area input::placeholder { color: #555; }

    .chat-input-area button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #00d4ff;
      border: none;
      color: #0a0a0f;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-input-area button:hover { background: #33ddff; }

    /* ─── Notes / Docs Panel ───────────────────────────────── */
    .list-panel { flex: 1; overflow-y: auto; padding: 12px; }

    .list-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .list-item:hover { border-color: rgba(0,212,255,0.3); background: rgba(0,212,255,0.05); }

    .list-item .item-title {
      font-size: 13px;
      font-weight: 500;
      color: #e0e0e0;
      margin-bottom: 4px;
    }

    .list-item .item-meta {
      font-size: 11px;
      color: #666;
    }

    .list-item .item-pin { color: #ffaa00; font-size: 12px; float: right; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #555;
      font-size: 13px;
    }

    /* ─── Quick Actions Bar ────────────────────────────────── */
    .quick-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 8px 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .quick-bar button {
      padding: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      color: #aaa;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .quick-bar button .icon { font-size: 16px; }
    .quick-bar button:hover { border-color: rgba(0,212,255,0.3); color: #00d4ff; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">𓂀</div>
    <div class="title">JARVISIUS</div>
    <div class="status" id="status-dot"></div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="active" data-tab="chat">💬 Chat</button>
    <button data-tab="notes">📝 Notes</button>
    <button data-tab="docs">📄 Docs</button>
    <button data-tab="tabs">🗂 Tabs</button>
  </div>

  <!-- Chat Panel -->
  <div class="panel active" id="panel-chat">
    <div class="chat-messages" id="chat-messages">
      <div class="msg jarvis">Good day, sir. JARVISIUS online. How may I assist you?</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Ask JARVIS anything... or use /commands" autocomplete="off">
      <button id="send-btn">→</button>
    </div>
  </div>

  <!-- Notes Panel -->
  <div class="panel" id="panel-notes">
    <div class="list-panel" id="notes-list">
      <div class="empty-state">No notes yet. Use /note &lt;title&gt; | &lt;content&gt;</div>
    </div>
  </div>

  <!-- Docs Panel -->
  <div class="panel" id="panel-docs">
    <div class="list-panel" id="docs-list">
      <div class="empty-state">No documents yet. Capture pages or create PDFs.</div>
    </div>
  </div>

  <!-- Tabs Panel -->
  <div class="panel" id="panel-tabs">
    <div class="list-panel" id="tabs-list">
      <div class="empty-state">Loading tabs...</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="quick-bar">
    <button id="qa-screenshot"><span class="icon">📸</span>Screen</button>
    <button id="qa-capture"><span class="icon">📄</span>Capture</button>
    <button id="qa-note"><span class="icon">📝</span>Note</button>
    <button id="qa-newtab"><span class="icon">🌐</span>New Tab</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
