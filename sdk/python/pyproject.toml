[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medina-organism"
version = "1.0.0"
description = "Unified Medina Organism SDK — All protocols in one living interface"
readme = "README.md"
license = {text = "ISIL-1.1"}
requires-python = ">=3.9"
authors = [
    {name = "Alfredo Medina Hernandez", email = "alfredo@medinatech.io"}
]
keywords = ["organism", "sdk", "phi", "sovereign", "intelligence", "quantum", "swarm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
numpy = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["medina_organism*"]
